version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: repairai
      POSTGRES_PASSWORD: repairai
      POSTGRES_DB: repairai
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - '6379:6379'
  api:
    image: node:20
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @repairai/api dev"
    env_file: .env.example
    ports:
      - '3001:3001'
    depends_on:
      - postgres
      - redis
  worker:
    image: node:20
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @repairai/worker dev"
    env_file: .env.example
    depends_on:
      - api
      - redis
  admin:
    image: node:20
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @repairai/admin dev"
    env_file: .env.example
    ports:
      - '3000:3000'
    depends_on:
      - api
volumes:
  pgdata:
